name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest commit for a ref needs verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: lint
            run: pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=12288" eslint --cache .
          - name: typecheck
            run: pnpm -r run typecheck && pnpm exec tsc --noEmit -p tsconfig.scripts.json
          - name: test
            run: CODEX_TEST_BIN="$GITHUB_WORKSPACE/data/codex-ci/node_modules/.bin/codex" pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=8192" vitest run
          - name: generated-assets
            run: pnpm --filter @floway-dev/agent-setup run generate-assets --check
          # `build.yaml` does not run on pull requests.
          # The Vite build owns its output assertions, so every build path
          # validates the emitted browser graph.
          - name: build
            run: pnpm run build:web
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install latest Codex for installer compatibility
        if: matrix.check.name == 'test'
        run: npm install --prefix data/codex-ci --no-save --package-lock=false @openai/codex@latest
      - name: Generate route types
        if: matrix.check.name == 'lint' || matrix.check.name == 'typecheck'
        run: pnpm run typegen
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
